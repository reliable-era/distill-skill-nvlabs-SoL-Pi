worker_processes 1;
pid nginx.pid;
error_log logs/error.log warn;
events { worker_connections 256; }
http {
    client_body_temp_path tmp/client;
    proxy_temp_path tmp/proxy;
    log_format routing '$time_iso8601 $request_method $uri status=$status upstream=$upstream_addr upstream_status=$upstream_status elapsed=$request_time';
    access_log logs/access.log routing;
    upstream local_qwen {
        least_conn;
        # Capacity weights from nginx-weight-capacity-benchmark.json (2026-10-05).
        server 127.0.0.1:18002 weight=12 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:18001 weight=11 max_fails=1 fail_timeout=5s;
        server 10.193.104.97:18002 weight=10 max_fails=1 fail_timeout=5s; # gpu01 GPUs 2/3
        server 10.193.104.97:18001 weight=10 max_fails=1 fail_timeout=5s; # gpu01 GPUs 0/1
        keepalive 4;
    }
    server {
        listen 127.0.0.1:8000;
        listen 127.0.0.1:18080; # initial endpoint compatibility
        server_name localhost;
        client_max_body_size 4m;
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"service":"local-qwen-load-balancer","backends":[18002,18001],"remote_backends":["10.193.104.97:18002","10.193.104.97:18001"]}';
        }
        location = /get_load {
            proxy_pass http://127.0.0.1:18003/get_load;
            proxy_next_upstream off;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_buffering off;
        }
        location /v1/ {
            proxy_pass http://local_qwen;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            send_timeout 900s;
            # Never resend an ambiguous generation request to another replica.
            proxy_next_upstream off;
            proxy_ignore_client_abort off;
            proxy_hide_header X-Solpi-Upstream;
            add_header X-Solpi-Upstream $upstream_addr always;
            add_header X-Accel-Buffering no always;
        }
        location / { return 404; }
    }
}
