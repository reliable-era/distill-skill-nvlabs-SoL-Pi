name: Validate skill upgrade
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build validation container
        run: docker build -f tests/validation/Dockerfile -t sol-pi-validation .
      - name: Validate installation and shipped resources
        run: docker run --rm --network none sol-pi-validation
