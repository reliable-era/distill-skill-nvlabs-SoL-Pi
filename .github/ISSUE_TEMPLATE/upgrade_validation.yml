name: Upgrade or performance validation
description: Propose a skill upgrade or report a measured regression.
title: '[Validation] '
body:
  - type: textarea
    attributes:
      label: Proposed change and rationale
      description: State the affected instructions or packaging and intended benefit.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Versions and comparison setup
      description: Record candidate and reference commits, model, agent version, limits, skill activation, tasks, and repeated rounds.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Validation results
      description: Link the Docker validation run. For behavioral changes, separately report verified solves, failure-inclusive tokens, timeouts, incomplete usage, and upstream retrieval. Installation checks alone do not prove performance.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Development and held-out separation
      description: Explain how tasks were selected and whether validation outcomes influenced the candidate.
